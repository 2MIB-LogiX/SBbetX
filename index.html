<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiveproX</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .mobile-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 390px;
            height: 844px;
            overflow: hidden;
        }

        #frameNormal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            border: none;
        }

        #frameatas {
            position: absolute;
            top: -5%;
            left: 10%;
            width: 120%;
            height: 120%;
            z-index: 10;
            border: none;
            opacity: 0;
            pointer-events: auto;
        }

        @media (max-width: 430px) {
            .mobile-box {
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-box">
        <iframe id="frameNormal" src="live.html"></iframe>
        <iframe id="frameatas" src="quotes.html"></iframe>
    </div>
</body>
</html>
