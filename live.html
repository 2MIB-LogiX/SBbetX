<style>
        /* Pulse Animation for Live Indicator */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0); }
        }
        .live-pulse {
            animation: pulse-glow 3.5s infinite;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen pt-16">
<!-- TopNavBar (Shared Component) -->
<!-- Nav intent is a watch page, which is transactional/focused. Suppressing the TopNavBar to prioritize canvas. -->
<main class="w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8 flex flex-col gap-6">
<!-- Left Column: Video & Stats -->
<div class="w-full flex flex-col gap-6">
<!-- Video Player Area -->
<div class="w-full bg-black rounded-lg overflow-hidden relative shadow-[0_4px_24px_rgba(0,0,0,0.5)] aspect-video border border-surface-variant group flex items-center justify-center">

<!-- Loading Spinner (Tampil saat halaman baru dimuat) -->
<div id="loadingSpinner" class="absolute z-20 flex items-center justify-center text-white transition-opacity duration-500 opacity-100">
    <span class="material-symbols-outlined text-8xl animate-spin">progress_activity</span>
</div>

<!-- Play Button Icon (Tersembunyi awalnya) -->
<button id="playButton" class="absolute z-20 text-white opacity-0 hover:opacity-100 transition-opacity hover:scale-110 transform duration-300 pointer-events-none flex items-center justify-center">
    <span class="material-symbols-outlined text-8xl" data-icon="play_circle">play_circle</span>
</button>

<!-- Overlays -->
<div class="absolute top-4 left-4 flex gap-3 items-center z-10">
<div class="flex items-center gap-2 bg-background/80 px-3 py-1.5 rounded-full border border-surface-variant backdrop-blur-sm">
<div class="w-2.5 h-2.5 rounded-full bg-[#00FF41] live-pulse"></div>
<span class="font-label-caps text-label-caps text-secondary-fixed-dim">LIVE</span>
</div>
<div class="bg-primary-container/80 px-3 py-1.5 rounded-full border border-primary/20 backdrop-blur-sm">
<span class="font-label-caps text-label-caps text-primary">HD 4K</span>
</div>
</div>

<!-- Playback Controls (Visible on Hover) -->
<div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-black/80 to-transparent p-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10 flex flex-col gap-2">
<div class="w-full h-1.5 bg-surface-variant rounded-full overflow-hidden cursor-pointer relative">
<div class="absolute top-0 left-0 h-full bg-[#00FF41] w-[78%]"></div>
<div class="absolute top-1/2 left-[78%] -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-white rounded-full"></div>
</div>
<div class="flex justify-between items-center text-on-surface">
<div class="flex items-center gap-4">
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="pause">pause</span></button>
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="volume_up">volume_up</span></button>
<span class="font-label-caps text-label-caps">78:42 / LIVE</span>
</div>
<div class="flex items-center gap-4">
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="settings">settings</span></button>
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="fullscreen">fullscreen</span></button>
</div>
</div>
</div>
</div>
<!-- Video Info & Donate Button -->
<div class="flex flex-col gap-4">
<h2 class="font-headline-md text-headline-md text-on-surface">Serie A : Lazio vs Genoa</h2>
<button class="bg-primary text-on-primary font-label-caps text-label-caps py-2 px-4 rounded-lg hover:bg-primary-fixed transition-colors w-fit flex items-center gap-2"><span class="material-symbols-outlined">favorite</span> Watch Other Live</button>
</div>
</div>
</main>

<!-- Script untuk mengganti Loading ke Tombol Play -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const spinner = document.getElementById('loadingSpinner');
        const playButton = document.getElementById('playButton');

        // Set waktu tunda 2 detik (2000 ms)
        setTimeout(() => {
            // Hilangkan loading spinner
            spinner.style.opacity = '0';
            
            // Tampilkan tombol play setelah animasi fade-out loading selesai (500ms)
            setTimeout(() => {
                spinner.style.display = 'none';
                // Hapus class opacity-0 & pointer-events-none agar tombol bisa diklik
                playButton.classList.remove('opacity-0', 'pointer-events-none');
                // Tambahkan opacity-80 agar tombol play terlihat
                playButton.classList.add('opacity-80');
            }, 500);
        }, 2000);
    });
</script>

</body>
</html>
